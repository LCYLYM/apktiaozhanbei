<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, height=device-height">
    <title>智语通 | ZhiYuTong</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    },
                    colors: {
                        glass: 'rgba(255, 255, 255, 0.25)',
                        glassBorder: 'rgba(255, 255, 255, 0.3)',
                        medical: '#FF3B30',
                        police: '#007AFF',
                        warning: '#FFCC00',
                    },
                    backdropBlur: {
                        xs: '2px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0f2f5;
            -webkit-font-smoothing: antialiased;
            overflow: hidden; /* Prevent body scroll, handle in app */
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            touch-action: none;
        }
        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }
        .glass-button:active {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(0.98);
        }
        
        /* Custom scrollbar hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Prevent page scroll when keyboard is open */
        input, textarea {
            touch-action: none;
        }

        /* Prevent viewport bounce on iOS */
        html, body {
            overscroll-behavior: none;
        }

        /* Prevent visual viewport changes */
        #root {
            height: 100vh;
            height: 100dvh;
            position: relative;
        }
    </style>
<!-- Local build: dependencies are bundled by Vite; no importmap needed. -->
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
